<section class="card">
  <h2 class="card-title">MESAS CON CUENTA SOLICITADA</h2>

  <div 
    *ngFor="let mesa of mesas" 
    class="card-mesa" 
    [class.selected]="mesaSeleccionada?.id === mesa.id"
    (click)="seleccionarMesa(mesa)">
    <div class="color-indicator red"></div>
    <div class="mesa-info">
      <h3>{{ mesa.nombre }}</h3>
      <p class="subtext">Comanda #{{ mesa.comanda }}</p>
      <p class="subtext">Estado: {{ mesa.estado }}</p>
    </div>
    <div class="mesa-monto">
      <span class="amount">${{ mesa.monto | number:'1.2-2' }} MXN</span>
      <span *ngIf="mesaSeleccionada?.id === mesa.id" class="badge-selected">SELECCIONADA</span>
    </div>
  </div>

  <div class="financial-actions" *ngIf="mesaSeleccionada">
    <p class="actions-label">Acciones Financieras para {{ mesaSeleccionada.nombre }}:</p>
    <div class="actions-grid">
      <button type="button" class="btn btn-outline" (click)="dividirCuenta()">Dividir Cuenta</button>
      <button type="button" class="btn btn-outline" (click)="aplicarDescuento()">Aplicar Descuento</button>
      <button type="button" class="btn btn-green" (click)="procesarCobro('Efectivo')">Cobrar Efectivo</button>
      <button type="button" class="btn btn-blue" (click)="procesarCobro('Tarjeta')">Cobrar Tarjeta</button>
    </div>
  </div>

  <div *ngIf="mesas.length === 0" class="empty-state">
    <p>No hay cuentas pendientes por cobrar.</p>
  </div>
</section>
